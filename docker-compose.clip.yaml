# Optional CLIP-enabled HMA instance for semantic image matching.
# See docs/integrations/hma-clip.md.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.clip.yaml up -d --build hma-clip
#
# GPU (Linux + nvidia-container-toolkit): uncomment the `deploy` block below and
# build with the PYTORCH_CUDA, TORCH_VERSION and TORCHVISION_VERSION for your
# CUDA version (see docs/integrations/hma-clip.md):
#   PYTORCH_CUDA=cu128 TORCH_VERSION=2.11.0 TORCHVISION_VERSION=0.26.0 \
#     docker compose -f docker-compose.yaml -f docker-compose.clip.yaml build hma-clip

services:
  hma-clip-postgres:
    image: postgres:15.18
    volumes:
      - hma_clip_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'postgres']
      interval: 2s
      start_period: 2s
    environment:
      POSTGRES_PASSWORD: postgres123
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

  hma-clip:
    build:
      context: ./hma/clip
      dockerfile: Dockerfile
      args:
        PYTORCH_CUDA: ${PYTORCH_CUDA:-cpu}
        TORCH_VERSION: ${TORCH_VERSION:-2.15.0}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION:-0.29.2}
    environment:
      POSTGRES_HOST: hma-clip-postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
      HMA_ALLOWED_HOSTNAMES: ${HMA_ALLOWED_HOSTNAMES:-}
    ports:
      # Loopback only: HMA has no authentication.
      - '127.0.0.1:9877:5100'
    volumes:
      # CLIP model weights (~1.4 GB) download on first use; keep them across rebuilds.
      - hma_clip_model_cache:/root/.cache/huggingface
    depends_on:
      hma-clip-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:5100/status')",
        ]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  hma_clip_pg_data:
  hma_clip_model_cache:
